[project]
name = "browser-engineering-study"
version = "0.1.0"
description = "Web Browser Engineering study notes and code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
]
# macOS: Jupyter 셀에서 Tk 창 스크린샷을 출력할 때 사용
macos = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser = ["*.css", "emoji/*.png"]

